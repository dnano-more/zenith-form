<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="zenithGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Badge Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#zenithGrad)" filter="url(#shadow)" />

  <!-- Inner Form Input & Zenith Peak Symbol -->
  <!-- Outer Form Box -->
  <rect x="128" y="128" width="256" height="256" rx="48" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Form Check / Zenith Peak Line -->
  <path d="M192 256 L240 304 L320 208" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Top Right Sparkle Accent -->
  <circle cx="368" cy="144" r="20" fill="#F59E0B" />
</svg>
